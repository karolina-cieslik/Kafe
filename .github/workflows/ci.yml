# CI – build Androida, testy JVM, detekt i lint. iOS pomijamy (brak runnera macOS w MVP).
name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Build i testy (Android/JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Jednorazowy build na CI – demon Gradle niepotrzebny.
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AGP 9.x wymaga JDK 17+; lokalnie używamy JBR 21 z Android Studio.
      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ubuntu-latest ma preinstalowany Android SDK (ANDROID_HOME) z zaakceptowanymi licencjami;
      # brakującą platformę (compileSdk 37) i build-tools AGP pobiera sam przy pierwszym buildzie.
      - name: Gradle (cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}

      # Robolectric pobiera obrazy android-all do ~/.m2 przy pierwszym teście UI.
      - name: Cache Robolectric
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Assemble debug
        run: ./gradlew :app:androidApp:assembleDebug

      # Testy urządzeniowe tylko kompilujemy (APK testowe) – bez emulatora na CI,
      # ale zmiana DAO / modułu Koin nie zepsuje ich niezauważenie.
      - name: Kompilacja testów urządzeniowych
        run: ./gradlew :app:shared:assembleAndroidDeviceTest

      - name: Testy JVM
        run: >-
          ./gradlew
          :core:testAndroidHostTest
          :app:shared:testAndroidHostTest
          :app:androidApp:testDebugUnitTest

      # Zastane naruszenia są w detekt-baseline.xml modułów, nowe łamią build.
      - name: Detekt
        run: ./gradlew detekt

      - name: Lint
        run: ./gradlew :app:androidApp:lintDebug

      - name: Raporty testów i lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
            **/build/reports/lint-results-*.html
            **/build/reports/detekt/
          if-no-files-found: ignore
          retention-days: 7
